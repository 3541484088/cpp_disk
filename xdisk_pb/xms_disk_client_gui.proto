syntax="proto3";	//版本号
package xdisk;		//名称空间

// 消息列表 目录列表 文件列表
enum XFileMsgType
{
	FILE_MSG_NONE = 0;
	GET_DIR_REQ = 1001;
	GET_DIR_RES = 1002;
	UPLOAD_FILE_REQ = 1003;
	UPLOAD_FILE_RES = 1004;
	SEND_SLICE_REQ = 1005;
	SEND_SLICE_RES = 1007;
	UPLOAD_FILE_END_REQ = 1008;
	UPLOAD_FILE_END_RES = 1009;
	DOWNLOAD_FILE_REQ = 1010;
	DOWNLOAD_FILE_RES = 1011;
	DOWNLOAD_FILE_BEGIN = 10012;	// 客户端开始传输文件（值保持兼容）
	DOWNLOAD_SLICE_REQ = 1012;
	DOWNLOAD_SLICE_RES = 1013;
	DELETE_FILE_REQ = 1014;
	DELETE_FILE_RES = 1015;
	NEW_DIR_REQ = 1016;
	NEW_DIR_RES = 1017;
	GET_DISK_INFO_REQ = 1018;
	GET_DISK_INFO_RES = 1019;

	// 共享文件夹相关 (2001+)
	CREATE_SHARE_FOLDER_REQ  = 2001;
	CREATE_SHARE_FOLDER_RES  = 2002;
	ADD_SHARE_USER_REQ       = 2003;
	ADD_SHARE_USER_RES       = 2004;
	REMOVE_SHARE_USER_REQ    = 2005;
	REMOVE_SHARE_USER_RES    = 2006;
	GET_SHARED_FOLDERS_REQ   = 2007;
	GET_SHARED_FOLDERS_RES   = 2008;
	GET_SHARED_DIR_REQ       = 2009;
	GET_SHARED_DIR_RES       = 2010;
	DOWNLOAD_SHARED_FILE_REQ = 2011;
	DOWNLOAD_SHARED_FILE_RES = 2012;
	UPLOAD_SHARED_FILE_REQ   = 2013;
	UPLOAD_SHARED_FILE_RES   = 2014;
	DELETE_SHARED_FILE_REQ   = 2015;
	DELETE_SHARED_FILE_RES   = 2016;
}

message XDiskInfo
{
	int64 avail = 1;
	int64 total = 2;
	int64 free = 3;
	int64 dir_size = 4;
}
message XGetDirReq
{
	bytes root = 1;
}

message XFileSlice
{
	XFileInfo file = 1;
	int64 size = 2;
	int64 offset = 3;
	bytes md5 = 4;
	bool is_ok = 5;
}

message XFileInfo
{
    bytes filename = 1;
    bytes filedir = 2;
    int64 filesize = 3;
    string filetime = 4;
    bool is_dir = 5;
	bytes md5 = 6;
	bytes local_path = 7;
	int64 net_size = 8;
	bool is_enc = 9;
	int64 ori_size = 10;
	bytes password = 11;
}

message XMsgTask
{
	XFileMsgType type = 1;
	bytes msg_ser = 2;
}

message XTaskList
{
	repeated XMsgTask tasks = 1;
}

message XFileMsgMap
{
	map<int32, XTaskList> msg_map = 1;
}

message XFileInfoList
{
	repeated XFileInfo files = 4;
}

message XFileTask
{
	int32 index = 1;
	string tasktime = 6;
	bool is_complete = 7;
	bool is_sec = 8;
	XFileInfo file = 9;
}

message XFileTaskList
{
	repeated XFileTask uploads = 1;
	repeated XFileTask downloads = 2;
}

// ===== 共享文件夹相关消息 =====
// 注意：用户可控字段使用 string（强制 UTF-8 语义），防止多字节编码 SQL 注入

message XShareUser {
    string username = 1;         // UTF-8, max 64 chars enforced server-side
    string permission_level = 2; // "read" / "write" / "admin"
}

message XSharedFolderInfo {
    int64  id = 1;
    string owner = 2;
    string name = 3;
    string created_at = 4;
    int32  user_count = 5;
    int32  file_count = 6;
}

message XCreateShareFolderReq {
    string name = 1;             // UTF-8, max 128 chars enforced server-side
    repeated XShareUser users = 2;
}
message XCreateShareFolderRes {
    int32 code = 1;
    bytes msg = 2;
    int64 folder_id = 3;
}

message XAddShareUserReq {
    int64 folder_id = 1;
    repeated XShareUser users = 2;
}

message XRemoveShareUserReq {
    int64 folder_id = 1;
    repeated string usernames = 2;
}

message XGetSharedFoldersReq {
    // username field ignored by server; server always uses token-verified identity
    string username = 1;
}
message XGetSharedFoldersRes {
    repeated XSharedFolderInfo folders = 1;
}

message XGetSharedDirReq {
    int64  folder_id = 1;
    string path = 2;
}
message XGetSharedDirRes {
    int32 code = 1;
    bytes msg = 2;
    repeated XFileInfo files = 3;
}

message XDownloadSharedFileReq {
    int64  folder_id = 1;
    string filename = 2;
    string filedir = 3;
    bytes  local_path = 4;
}
message XDownloadSharedFileRes {
    int32  code = 1;
    bytes  msg = 2;
    string authorized_path = 3;
    XFileInfo file_info = 4;
}

message XUploadSharedFileReq {
    int64  folder_id = 1;
    string filedir = 2;
}
message XUploadSharedFileRes {
    int32  code = 1;
    string authorized_filedir = 2;
    bytes  msg = 3;
}

message XDeleteSharedFileReq {
    int64  folder_id = 1;
    string filename = 2;
    string filedir = 3;
}
